<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
       *{
         margin: 0px;
         padding: 0px;
       }
       body{
         display: flex;
         height: 100vh;
         align-items: center;
         justify-content: center;
         background-color: black;
       }
       .one{
         position: relative;
         height: 185px;
         width: 285px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx9 5s linear infinite;
         transform: rotateX(30deg);
       }
       .one1{
         position: absolute;
         height: 160px;
         width: 260px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx8 5s linear infinite;
         transform: rotateX(30deg);
       }
      .one2{
         position: absolute;
         height: 140px;
         width: 240px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx7 5s linear infinite;
         transform: rotateX(30deg);
       }
       .one3{
         position: absolute;
         height: 120px;
         width: 220px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx6 5s linear infinite;
         transform: rotateX(30deg);
       }
       .one4{
         position: absolute;
         height: 100px;
         width: 200px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx5 5s linear infinite;
         transform: rotateX(30deg);
       }
       .one5{
         position: absolute;
         height: 80px;
         width: 180px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx4 5s linear infinite;
         transform: rotateX(30deg);
       }
      .one6{
         position: absolute;
         height: 60px;
         width: 160px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx3 5s linear infinite;
         transform: rotateX(30deg);
       }
       .one7{
         position: absolute;
         height: 40px;
         width: 140px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx2 5s linear infinite;
         transform: rotateX(30deg);
       }
      .one8{
         position: absolute;
         height: 20px;
         width: 120px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx1 5s linear infinite;
         transform: rotateX(30deg);
       }
       .one9{
         position: absolute;
         height: 5px;
         width: 100px;
         border: 1px solid white;
         border-radius: 60%;
         animation: rtx 5s linear infinite;
         transform: rotateX(30deg);
       }
       @keyframes rtx{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-150px,-150px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(150px,150px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
     @keyframes rtx1{
         0%{
           transform: translate(0px,0px) rotateX(30deg)  rotateY(0deg);
         }
         25%{
           transform: translate(-140px,-140px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(140px,140px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx2{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-130px,-130px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(130px,130px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx3{
         0%{
           transform: translate(0px,0px) rotateY(0deg)
           rotateX(30deg);
         }
         25%{
           transform: translate(-120px,-120px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(120px,120px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx4{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-110px,-110px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(110px,110px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx5{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-100px,-100px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(100px,100px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx6{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-90px,-90px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(90px,90px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx7{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-80px,-80px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(80px,80px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
       @keyframes rtx8{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-70px,-70px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(70px,70px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
    @keyframes rtx9{
         0%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(0deg);
         }
         25%{
           transform: translate(-60px,-60px) rotateX(90deg) rotateY(90deg);
         }
         50%{
           transform: translate(0px,0px) rotateX(180deg) rotateY(180deg);
         }
         75%{
           transform: translate(60px,60px) rotateX(270deg) rotateY(270deg);
         }
         100%{
           transform: translate(0px,0px) rotateX(30deg) rotateY(360deg);
         }
       }
    </style>
  </head>
  <body>
    <div class="one"></div>
    <div class="one1"></div>
    <div class="one2"></div>
    <div class="one3"></div>
    <div class="one4"></div>
    <div class="one5"></div>
    <div class="one6"></div>
    <div class="one7"></div>
    <div class="one8"></div>
    <div class="one9"></div>
  </body>
</html>
